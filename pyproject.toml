[project]
name = "devops-toolbox"
version = "1.0.0"
description = "Essential, tested, and secure DevOps CLI utilities for Linux system administration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "loiti" }]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
