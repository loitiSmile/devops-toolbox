[project]
name = "devops-toolbox"
version = "1.1.0"
description = "Essential, tested, and secure DevOps CLI utilities for Linux system administration and network diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "loiti" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "flake8>=7.0.0"
]

[project.scripts]
ssl-checker = "bin.ssl_checker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bin"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
