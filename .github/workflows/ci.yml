name: CI & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "bin tests"

      - name: Run Python Linting (Ruff & Flake8 with uv)
        run: |
          uv run --extra dev ruff check bin/ tests/
          uv run --extra dev flake8 bin/ tests/ --max-line-length=120

      - name: Run Python Unit Tests (with uv)
        run: |
          uv run python -m unittest discover -s tests/ -p "test_*.py"

      - name: Run Shell Script Tests
        run: |
          chmod +x bin/* tests/*.sh
          bash tests/test_system_report.sh

  security-scan:
    name: Security & SAST Analysis (CodeQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  secret-detection:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
